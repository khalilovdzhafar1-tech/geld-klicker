
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Money Clicker</title>
<style>
* { box-sizing:border-box; }
body {
  margin:0;
  background:linear-gradient(135deg,#101827,#172b40);
  color:white;
  font-family:Arial,sans-serif;
  text-align:center;
  padding:20px;
}
h1 { color:#ffd700; }
.panel {
  max-width:600px;
  margin:15px auto;
  padding:20px;
  background:#203449;
  border-radius:18px;
  box-shadow:0 5px 20px #0005;
}
.money {
  color:#4cff9b;
  font-size:38px;
  font-weight:bold;
}
button {
  border:0;
  border-radius:12px;
  padding:13px 18px;
  margin:6px;
  cursor:pointer;
  font-weight:bold;
  background:#ffc928;
  color:#202020;
}
button:hover { transform:scale(1.04); }
#click {
  font-size:24px;
  padding:25px 45px;
  background:#24d878;
}
.upgrade {
  background:#304d66;
  border-radius:12px;
  padding:12px;
  margin:10px 0;
}
.upgrade button { background:#45d99a; }
table {
  width:100%;
  border-collapse:collapse;
}
td,th {
  padding:10px;
  border-bottom:1px solid #ffffff30;
}
small { color:#b9c8d8; }
</style>
</head>
<body>

<h1>💰 MONEY CLICKER</h1>

<div class="panel">
  <div class="money" id="money">$0</div>
  <p>Level: <span id="level">1</span></p>
  <p>Geld pro Klick: <span id="power">1</span></p>
  <p>Auto-Geld pro Sekunde: <span id="auto">0</span></p>
  <button id="click" onclick="earn()">💵 GELD KLICKEN</button>
</div>

<div class="panel">
  <h2>🚀 UPGRADES</h2>
  <div id="upgrades"></div>
</div>

<div class="panel">
  <h2>🏆 RANGLISTE</h2>
  <table>
    <thead><tr><th>Platz</th><th>Spieler</th><th>Vermögen</th></tr></thead>
    <tbody id="ranking"></tbody>
  </table>
  <small>Lokale Demo-Rangliste – noch nicht global.</small>
</div>

<div class="panel">
  <h2>🌟 REBIRTH</h2>
  <p>Starte neu und erhalte einen permanenten Multiplikator!</p>
  <p>Rebirth: <span id="rebirth">0</span></p>
  <button onclick="doRebirth()">REBIRTH (1 Million)</button>
</div>

<script>
let money = 0;
let total = 0;
let power = 1;
let auto = 0;
let level = 1;
let rebirth = 0;
let multiplier = 1;

const upgrades = [
  {name:"🥉 Bronze-Klicker", cost:25, type:"power", value:1},
  {name:"🥈 Silber-Klicker", cost:150, type:"power", value:5},
  {name:"🥇 Gold-Klicker", cost:800, type:"power", value:20},
  {name:"💎 Diamant-Klicker", cost:5000, type:"power", value:100},
  {name:"🤖 Auto-Klicker", cost:100, type:"auto", value:1},
  {name:"⚙️ Mega-Auto-Klicker", cost:1500, type:"auto", value:10},
  {name:"🏭 Geld-Fabrik", cost:10000, type:"auto", value:75},
  {name:"🚀 Super-Fabrik", cost:100000, type:"auto", value:500},
  {name:"👑 Klick-Multiplikator", cost:2500, type:"mult", value:2},
  {name:"🌌 Ultra-Multiplikator", cost:25000, type:"mult", value:3}
];

let costs = upgrades.map(u => u.cost);
let bought = upgrades.map(() => 0);

function earn() {
  let amount = power * multiplier;
  money += amount;
  total += amount;
  update();
}

function buy(i) {
  let u = upgrades[i];
  if(money < costs[i]) return;

  money -= costs[i];
  bought[i]++;

  if(u.type === "power") power += u.value;
  if(u.type === "auto") auto += u.value;
  if(u.type === "mult") multiplier *= u.value;

  costs[i] = Math.floor(costs[i] * 1.6);
  update();
}

function doRebirth() {
  if(money < 1000000) {
    alert("Du brauchst 1 Million Dollar!");
    return;
  }

  money = 0;
  power = 1;
  auto = 0;
  multiplier = 1;
  bought = upgrades.map(() => 0);
  costs = upgrades.map(u => u.cost);
  rebirth++;
  multiplier = 1 + rebirth;
  update();
}

function update() {
  level = Math.floor(Math.sqrt(total / 100)) + 1;

  document.getElementById("money").textContent =
    "$" + Math.floor(money).toLocaleString("de-DE");
  document.getElementById("power").textContent =
    Math.floor(power * multiplier);
  document.getElementById("auto").textContent =
    Math.floor(auto * multiplier);
  document.getElementById("level").textContent = level;
  document.getElementById("rebirth").textContent = rebirth;

  document.getElementById("upgrades").innerHTML =
    upgrades.map((u,i) => `
      <div class="upgrade">
        <b>${u.name}</b><br>
        <small>Gekauft: ${bought[i]}</small><br>
        <button onclick="buy(${i})">
          Kaufen – $${costs[i].toLocaleString("de-DE")}
        </button>
      </div>
    `).join("");

  updateRanking();
}

function updateRanking() {
  let players = [
    {name:"👑 MoneyKing",score:2500000},
    {name:"💎 RichPlayer",score:850000},
    {name:"🚀 ClickMaster",score:320000},
    {name:"⭐ Millionaire",score:120000}
  ];

  players.push({name:"🧑 Du",score:Math.floor(total)});

  players.sort((a,b) => b.score-a.score);

  document.getElementById("ranking").innerHTML =
    players.map((p,i) => `
      <tr style="${p.name.includes('Du')?'color:#4cff9b;font-weight:bold':''}">
        <td>${i===0?'🥇':i===1?'🥈':i===2?'🥉':i+1}</td>
        <td>${p.name}</td>
        <td>$${p.score.toLocaleString("de-DE")}</td>
      </tr>
    `).join("");
}

setInterval(() => {
  let amount = auto * multiplier;
  money += amount;
  total += amount;
  update();
},1000);

update();
</script>
</body>
</html>
